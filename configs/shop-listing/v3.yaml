    - label: Q3
      title: 是完全线下的吗？
      lines:
        - 线上直播课。虚拟商品，报名后进班级群，不发实物。
    - label: Q4
      title: 没有技术背景能跟上吗？
      lines:
        - 能。Day 1 从下载安装开始手把手带你做，边做边形成技能积累。
    - label: Q5
