    - type: raw
      text: |-
        1. **为什么有 V3**：V2《AI赚钱系统自我进化训练营》被判定为「涉及【AI盈利课程】，平台暂未开放售卖」。微信小店教育培训类目禁售「教授使用 AI 开展商业活动或营利」的课程，允许纯技术类（工具操作、技术原理、提示词、代码开发）。V3 按此口径重写。
        2. **类目建议**：优先选技术类目（人工智能 / 软件技术 / IT 技能），**不要**选副业、创业、营销、电商等盈利导向类目。商品属性建议填「虚拟商品 · 数字课程」。原「读书卡类」口径可作为备选。
        3. **上架前必检**：官方禁用词库已内置在 `scripts/check-listing-compliance.ts`（含直接禁用词与间接话术两类），一条命令跑完全量扫描，出现即删：
           `bun run scripts/check-listing-compliance.ts`
        4. **不要自行加价宣传**：图中与文案均不写死售价，价格在商品后台设置；也不要把「效果承诺」「回本」「多久见效」写进详情页。
        5. **域名**：官网地址已从图中移除，需要时再补。
        6. **图片**：封面大字报用 `main-0-title.png`，主图第 1 张用 `main-1-hero.png`；详情页建议按「主视觉 → 课程体系 → 适合谁 → 重要提醒 → 上课流程 → 作者与 FAQ」顺序铺排。
        7. **作者**：署名已确认为「{{author.name}} · {{author.role}}」，头像使用 `assets/shop-listing/author-avatar.png`；换人需同步替换长图与详情文案。
