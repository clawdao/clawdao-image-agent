              - 每一步都有验收标准
      - kind: section
        label: 目标客户
        title: 谁适合来，谁不必来
        desc: 这门课解决的是「用了没用起来」的问题，不是「要不要用 AI」的问题。
      - kind: cards
        columns: 2
        items: "{{content.targets}}"
      - kind: note
        text: 不必来：只想要资料包不愿听课的人；期待立竿见影的人；完全不想动手配置的人。
      - kind: rows
        title: 常见问题
        items: "{{content.faq}}"
      - kind: note
        text: 我们给你五项能力：可检测 · 可决策 · 可执行 · 可追溯 · 可信任。也要你三件投入：引进 · 重视 · 投入。五项能力 × 你的三件投入 = 你的业务确定性。
      - kind: footer
        text: 利姆斯科技 · 亿检链团队
