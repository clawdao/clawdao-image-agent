author:
  name: 顺道大叔
  role: 亿检链创始人 · 开发者
  avatar: ./assets/shop-listing/author-avatar.png
  bullets:
    - 亿检链平台联合创始人
    - 《Node.js 区块链开发》《Web3.0 数字化实战》作者
    - 200+ 企业客户咨询高级顾问
    - 军工、政府、企业等重磅案例
content:
  modules:
    - label: M1
      title: 智能体安装配置与调试
      lines:
        - 零基础装好智能体，完成环境配置与参数调试，跑通第一个可用的智能体。
    - label: M2
      title: 提示词与需求模板
      lines:
        - 拆解提示词结构，沉淀需求模板。
        - 把零散信息整理成结构化需求，重复提问变成可复用资产。
    - label: M3
      title: 系统自我进化机制体验
      lines:
        - 体验系统自我进化机制，看懂反馈—调整—再验证的持续优化循环。
    - label: M4
      title: 业务系统搭建
      lines:
        - 以公众号运营自动化系统为例，从零搭出「选题-写作-作图-排版-发布」全流程。
    - label: M5
      title: 效率工具落地
      lines:
        - 把智能体接进日常工具，沉淀可复用的操作方法。
        - 流程复用：下一次直接调用，日常流程真正提效。
  audience:
    - tag: 企业高管
      title: 让 AI 落进真实流程
      lines:
        - 不想再买一套概念
    - tag: 实体老板
      title: 需求 / 交付 / 复盘
      lines:
        - 哪一环能被接管
    - tag: 创业者
      title: 一个人干一支团队的活
      lines:
        - 从第一天就系统化
    - tag: 自媒体 · 超级个体
      title: 内容创作辅助
      lines:
        - 内容产能与素材加工
  targets:
    - tag: 落地难
      title: 企业高管
      lines:
        - 想把 AI 落进公司流程
    - tag: 流程靠人扛
      title: 实体老板
      lines:
        - 需求交付复盘
    - tag: 起步期
      title: 创业者
      lines:
        - 一个人干一支团队
    - tag: 经验沉淀
      title: 自媒体 / 超级个体
      lines:
        - 内容产能与素材加工
  faq:
    - label: Q1
      title: 上课需要准备什么？
      lines:
        - 一台电脑。安装包与环境自检清单课前发放。
    - label: Q2
      title: 10+ 节课程怎么安排？
      lines:
        - 按五个模块顺序推进，每个模块都有对应的作业模板，边做边沉淀。
    - label: Q3
      title: 直播咨询怎么参加？
      lines:
        - 报名后进班级群，群内通知直播时间与答疑安排。
    - label: Q4
      title: 没有技术背景能跟上吗？
      lines:
        - 能。第一个模块从下载安装开始手把手带你做，边做边形成技能积累。
    - label: Q5
      title: 课程会包含什么？
      lines:
        - 方法、工具与作业模板（含提示词模板与项目搭建清单）；能应用到什么程度，是你自己练出来的。
  targetTable:
    - who: 企业高管
      gain: 把 AI 落进公司真实流程，而不是再买一套概念
    - who: 实体老板
      gain: 需求、交付、复盘——看清哪一环能被 AI 接管
    - who: 创业者
      gain: 一个人干一支团队的活，从第一天就系统化
    - who: 自媒体 / 超级个体
      gain: 同时提升内容产能与素材加工效率，经验可复制可复用
    - who: 对 AI 工具与方法感兴趣的个人
      gain: 沉淀一套自己的判断与动作
