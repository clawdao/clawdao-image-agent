      text: 业务系统搭建示例：公众号运营自动化系统
    - type: raw
      text: |-
        模块四以**公众号运营自动化系统**为例，从零演示用亿检智能体搭建「选题-写作-作图-排版-发布」全流程，
        并讲解系统从搭建到优化的全流程操作方法。

        - **选题**：把选题变成可排期的清单——固定采集维度，输出可排期的选题表
        - **写作**：用需求模板生成可改的初稿——提示词模板 + 素材清单，输出结构化初稿
        - **作图**：配图与封面一次产出一组——固定版式与尺寸，批量产出素材
        - **排版**：套用版式模板出图文——固定排版规则，输出可直接预览的图文
        - **发布**：按排期发布并回收数据——发布数据回流，用于下一轮提示词与模板优化
