    - type: heading
      level: 2
      text: 运营备注（不对外展示）
    - type: raw
      text: |-
        1. **为什么有 V7**：V2《AI赚钱系统自我进化训练营》被判定为「涉及【AI盈利课程】，平台暂未开放售卖」；V3 按纯技术口径重写并通过自查；V4 把课程名改为「{{product.name}}」（平台反馈「工作流」已过时）并换成经典蓝；V7 保留合规文案口径，把交付形式改为「10+ 节课程 + 直播咨询 + 作业模板 + 社群答疑」，结构改为五个模块，视觉换成清新绿有机底，并启用「Logo + {{brand.text}}」右上角品牌位。
        2. **平台合规口径**：视频号小店 / 视频号与抖音尚品对「教育培训」类目都禁止教授使用 AI 开展商业活动或营利的课程（如赚钱、变现、获客、副业、涨粉、带货等）；允许纯技术类（工具操作、技术原理、提示词、代码开发、系统搭建）。因此本版本全文不出现任何效果承诺与经营导向表述，只讲工具怎么用、系统怎么搭。**具体条款编号与判定口径以两个平台后台最新规则为准，上架前需人工核对一次。**
        3. **风险点与备用案例**：模块四使用「公众号运营自动化系统」作演示案例，语汇锁定在「选题-写作-作图-排版-发布」的技术流程，不含任何流量、转化类表述。若平台机审仍对「运营」二字敏感，备用案例：①「企业内部内容生产系统」　②「工单与售后协同系统」，替换时只需改模块四文案与长图对应模块，海报其余部分不受影响。
        4. **类目建议**：优先选技术类目（人工智能 / 软件技术 / IT 技能），**不要**选副业、创业、营销、电商等盈利导向类目。商品属性填「虚拟商品 · 数字课程（技术实战）」。
        5. **上架前必检**：官方禁用词库已内置在 `scripts/check-listing-compliance.ts`（含直接禁用词、间接话术、关联高危词三类），一条命令跑完全量扫描，出现即删：
           `bun run scripts/check-listing-compliance.ts v7`
        6. **不要自行加价宣传**：图中与文案均不写死售价，价格在商品后台设置；也不要把「效果承诺」「回本」「多久见效」写进详情页。
        7. **域名**：官网地址已从图中移除，需要时再补。
        8. **图片**：封面大字报用 `main-0-title.png`，主图第 1 张用 `main-1-hero.png`；详情页建议按「主视觉 → 五个模块 → 适合谁 → 重要提醒 → 模块详解 → 作者与 FAQ」顺序铺排；需要单独介绍讲师时用 `detail-3-author.png`（讲师专页，与长图里的头像名片同源）。
        9. **纯色底图（重要）**：视频号小店在「送礼/推荐」等场景要用纯色底图，平台自带的 AI 编辑工具会把深底海报抠成“主体+白底”，白字直接消失、字变虚影，**不可用**。已改用本地重排的两张：
           - `main-5-plain-light.png`：浅底平涂（清新绿方案下为纯白底，文字全部深色系）
           - `main-6-plain-deep.png`：深底平涂（清新绿方案下为纯绿底，保留品牌色，主体对比更硬）
           两张都是 1080×1080、无渐变无纹理无暗角的平涂底，元素与 `main-0-title.png` 完全一致，可直接上传。
        10. **配色方案**：三套方案已参数化（暖色琥珀 / 经典商务蓝 / 清新绿），生成时用 `--theme` 选择，默认清新绿：
           `bun run scripts/gen-shop-listing-v7.ts --theme fresh`
           换方案时，`main-5-plain-light` / `main-6-plain-deep` 会自动换成对应方案的浅底 / 深底纯色图；加 `--out` 可换输出目录，避免覆盖当前交付：
           `bun run scripts/gen-shop-listing-v7.ts --theme blue --out ./outputs/shop-listing-v7-blue`
        11. **品牌位**：右上角统一「Logo + {{brand.text}}」（白色圆角 chip 承托），只有 `main-4-notice.png` 保留「利姆斯科技 · {{brand.text}}团队」全称。
        12. **作者**：署名已确认为「{{author.name}} · {{author.role}}」，头像使用 `assets/shop-listing/author-avatar.png`；换人需同步替换长图与详情文案。
