        - label: 赠品
          value: "{{product.gifts}}"
        - label: 课程定位
          value: "{{product.position}}"
    - type: hr
    - type: heading
      level: 2
      text: 课程性质说明
    - type: raw
      text: |-
        这是一堂 **AI 智能体实操课 + 企业数智化系统自我进化体验课**。

        课程内容覆盖：智能体安装配置与调试、提示词与需求模板、系统自我进化机制体验、业务系统搭建、效率工具落地。

        课程**只讲技术能力与工具用法**，**不做任何效果承诺**。课程性质是企业数智化能力建设培训，**不涉及任何形式的经营活动内容**。给你的是方法、工具和可以照着做的步骤，能应用到什么程度，由你自己练出来。
    - type: hr
    - type: heading
      level: 2
      text: 一句话说明
    - type: raw
      text: |-
        10+ 节 Agent 智能体实战课程：从装好第一个智能体，到用亿检智能体搭出一套会自我进化的数智化系统。

        不讲概念，只讲你回去要做的第一步。
    - type: hr
    - type: heading
      level: 2
      text: 课程简介
    - type: raw
      text: |-
        这不是一堂讲概念的课。

        10+ 节课程，我们陪你把「亿检智能体」装进电脑、接进业务、跑通一次完整流程：
        从第一个模块的手把手安装，到业务系统搭建（以公众号运营自动化系统为例的完整演示），
        再到把方法接回日常工具。

