            title: "{{content.modules.M2.title}}"
            lines:
              - 拆解提示词结构：目标、上下文、约束、输出格式
              - 沉淀需求模板，把重复提问变成可复用资产
              - 现场把一个真实需求写成模板并跑一遍
          - time: "{{content.modules.M3.label}}"
            title: "{{content.modules.M3.title}}"
            lines:
              - 体验反馈—调整—再验证机制的实际运行过程
              - 看懂每次改动背后的原因与判定依据
              - 把人工改一遍，变成按同一标准再迭代一轮
          - time: "{{content.modules.M4.label}}"
            title: "{{content.modules.M4.title}}"
            lines:
              - 从零搭出一条可复用的自动化流程
              - 把工具按节点串接起来，配好每一步的参数
              - 讲清每一步的操作方法与验收标准
          - time: "{{content.modules.M5.label}}"
            title: "{{content.modules.M5.title}}"
            lines:
