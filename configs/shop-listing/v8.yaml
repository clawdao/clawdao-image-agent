copy:
  fileName: 商品文案.md
  blocks:
    - type: heading
      level: 1
      text: "{{product.name}}"

    - type: fields
      fields:
        - label: 商品名称
          value: "{{product.name}}"
        - label: 商品属性
          value: "{{product.category}}"
        - label: 售价
          value: "以商品后台设置为准（图与文案均不写死价格）"
        - label: 品牌
          value: "{{product.brand}}"
        - label: 交付形式
          value: "{{product.delivery}}"
        - label: 赠品
          value: "{{product.gifts}}"
        - label: 课程定位
          value: "{{product.position}}"

    - type: hr
    - type: heading
      level: 2
      text: 课程性质说明
    - type: raw
      text: |-
        这是一堂 **零基础智能体实操课**，属于**{{vars.titleModifier}}**方向的技术实操课程。10+ 节实操课，配套直播答疑。

        课程内容覆盖：智能体安装配置与调试、提示词与需求模板、持续优化机制体验、工具串接与流程编排、效率工具落地。

        课程**只讲授工具操作、技术配置与流程编排方法**，内容全部围绕工具安装、参数调试、提示词结构、流程编排与验收标准展开。课程提供方法、工具和可参照的实操步骤，实际掌握程度取决于学习者个人动手练习。

    - type: hr
    - type: heading
      level: 2
      text: 一句话说明
    - type: raw
      text: |-
        10+ 节实操课 + 作业模板 + 直播答疑：从装好第一个智能体，到把方法带回自己每天在用的工具里。

        不堆砌抽象概念，聚焦零基础能照着做的实操步骤。

    - type: hr
    - type: heading
      level: 2
      text: 课程简介
    - type: raw
      text: |-
        这不是一堂侧重理论概念的课，也不要求你有技术背景。

        10+ 节实操课，带着你把「亿检智能体」从下载安装一路跑通：先装好、配好参数、写好提示词，再把工具按节点串接成一条自己用得上的流程，最后迁移到常用的工作工具里。

        学习完成后，你收获的不是单一软件，而是一套**可复用的工具配置方案、流程编排方法，以及个人技能沉淀清单**。

        课程主线遵循{{brand.text}}的 LIMS 方法框架：**L 检测 · I 决策 · M 执行 · S 追溯**，配套智能体辅助下的反馈调整迭代循环。

    - type: hr
    - type: heading
      level: 2
      text: 实操课安排
    - type: raw
      text: |-
        10+ 节实操课按五个模块顺序推进，每个模块围绕一个可验收的动作展开，配套作业模板与验收清单。

    - type: moduleOverview
    - type: raw
      text: |-
        直播答疑集中解答实操中遇到的问题，作业模板在班级群领取。

    - type: hr
    - type: heading
      level: 2
      text: 课程内容（五个模块）
    - type: modules
    - type: hr
    - type: heading
      level: 2
      text: 上课流程
