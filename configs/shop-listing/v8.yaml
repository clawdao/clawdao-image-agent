id: v8
label: 亿检智能体零基础实操训练营（V8 · 清新绿 · 当前交付版）
outputDir: ./outputs/shop-listing-v8
theme: fresh
compliance: ./configs/compliance/v8.yaml
vars:
  titleModifier: 人工智能培训
  titleMain: 亿检智能体零基础实操训练营
  titleLines: |-
    亿检智能体
    零基础实操训练营
  enLabel: YIJIAN AGENT HANDS-ON CAMP
  brandFull: 利姆斯科技 · 亿检链团队
product:
  name: 亿检智能体零基础实操训练营
  category: 虚拟商品 · 数字课程（智能体工具技术实战）
  brand: 利姆斯科技 · 亿检链团队
  delivery: 10+ 节实操课 + 作业模板 + 直播答疑 + 班级群交流
  gifts: 选题智能体 + 内容智能体（内容创作辅助工具模板）
  position: 面向零基础学习者，10+ 节实操课：装好智能体、写好提示词、把方法带回日常
brand:
  logo: ./assets/shop-listing/lims-logo.png
  text: 亿检链
author:
  name: 顺道大叔
  role: 亿检链创始人 · 开发者
  avatar: ./assets/shop-listing/author-avatar.png
  bullets:
    - 亿检链平台联合创始人
    - 《Node.js 区块链开发》《Web3.0 数字化实战》作者
    - 长期企业级项目实践与咨询经验
    - 军工、政府、企业等多场景项目实践经历
content:
  modules:
    - label: M1
      title: 智能体安装配置与调试
      summary: 装起来：下载安装、环境自检、参数调通
      lines:
        - 完成智能体部署与环境配置、参数调试，跑通首个可用智能体实例。
    - label: M2
      title: 提示词与需求模板
      summary: 写清楚：拆解提示词结构，沉淀需求模板
      lines:
        - 拆解提示词结构，沉淀标准化需求模板。
        - 把零散信息整理成结构化需求，重复交互沉淀为可复用资产。
    - label: M3
      title: 持续优化机制体验
      summary: 用顺了：看懂每次改动带来的输出变化
      lines:
        - 实践反馈—调整—再验证的迭代循环，
        - 看懂参数与提示词改动带来的输出变化。
    - label: M4
      title: 工具串接与流程编排
      summary: 串起来：按节点配置，掌握编排与验收
      lines:
        - 把工具按节点串接起来，掌握编排逻辑、
        - 节点配置方法与输出验收标准，完成完整跑通验证。
    - label: M5
      title: 效率工具落地
      summary: 带得走：接进日常工具链，沉淀可复用配置
      lines:
        - 将智能体对接至常用工作工具，沉淀可复用的实操配置方法。
        - 把课堂里的方法带回真实工作里。
  audience:
    - tag: 零基础
      title: 没接触过也能跟上
      lines:
        - 从下载安装讲起
        - 术语当场解释
    - tag: 内容策划岗
      title: 内容与素材处理
      lines:
        - 用工具处理日常素材
        - 沉淀可复用的方法
    - tag: 中小企业负责人
      title: 需求 / 交付 / 复盘
      lines:
        - 识别可引入工具的环节
    - tag: 小团队负责人
      title: 先跑通，再复制
      lines:
        - 方法验证后再分配执行
  targets:
    - tag: 零基础起步
      title: 零基础学习者
      lines:
        - 从下载安装开始上手
    - tag: 内容处理
      title: 内容策划岗 / 独立工作者
      lines:
        - 内容与素材的实操处理
    - tag: 需求落地
      title: 中小企业负责人
      lines:
        - 需求 / 交付 / 复盘
    - tag: 起步阶段
      title: 小团队负责人
      lines:
        - 方法验证后再分工
  faq:
    - label: Q1
      title: 上课需要准备什么？
      lines:
        - 一台电脑。安装指引与环境自检清单会在课前发放。
    - label: Q2
      title: 课程怎么安排？
      lines:
        - 10+ 节实操课按五个模块推进，每个模块都有配套作业模板。
    - label: Q3
      title: 直播答疑怎么参加？
      lines:
        - 报名后进班级群，群内同步答疑时间与作业提交安排。
    - label: Q4
      title: 没有技术背景能跟上吗？
      lines:
        - 可以。第一天从软件下载安装开始手把手教学，跟着实操逐步积累工具使用技能。
    - label: Q5
      title: 课程会包含什么？
      lines:
        - 实操方法、工具资源与作业模板（含提示词模板与验收清单）；个人实际应用效果取决于自身实操练习投入。
    - label: Q6
      title: 训练营怎么上课？
      lines:
        - 实操课按模块顺序推进，直播答疑集中解答实操问题。
  targetTable:
    - who: 零基础学习者
      gain: 从下载安装到跑通第一个智能体，拿到一套可复现的操作步骤
    - who: 内容策划岗 / 独立工作者
      gain: 借助智能体工具处理内容与素材，沉淀可复用的实操方法
    - who: 中小企业负责人
      gain: 理解需求、交付、复盘的工作链路，识别可引入智能体工具辅助的工作环节
    - who: 小团队负责人
      gain: 掌握工具串接与流程编排方法，验证后再分配团队执行
    - who: 对智能体工具与方法感兴趣的个人
      gain: 建立对智能体工具的实操认知，形成个人操作方法论
