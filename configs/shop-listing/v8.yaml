    - type: heading
      level: 2
      text: 运营备注（不对外展示）
    - type: raw
      text: |-
        1. **本轮 r7 改了什么（2026-10-21）**：**删掉全部「3 天连播」表述**——课程从来没有 3 天连播，只有 10+ 节实操课 + 直播答疑。原来的「3 天连播 / 3 天 / D1-D2-D3 三天安排 / 每天一个主题连播」属于**事实性错误陈述**（与实际交付不符，重则被判虚假宣传），因此不是在原句上改词，而是把整条交付口径重写：商品字段（交付形式 / 课程定位）、4 张封面（数值卡 / 徽章 / 副标题）、方图 1-4、长图 1-2、详情页（课程性质说明 / 一句话说明 / 课程简介 / 安排节 / 上课流程 / FAQ）逐句重写。r6 出图产物已归档到 `outputs/_archive/shop-listing-v8-r6-20261021/`。
        2. **新的交付口径（以后只写这个）**：**10+ 节实操课 + 作业模板 + 直播答疑 + 班级群交流**。方图 2 从「三天安排（D1/D2/D3）」改成「**课程安排（五个模块）**」，行数据从 `DAY_PLAN` 换成从 `MODULE_CARDS` 派生的 `MODULE_OVERVIEW`（图文同源）；详情页原「3 天安排」一节改成「**实操课安排**」。
        3. **检查器新增硬断言**：对外内容（商品字段 + 海报 + 对外文案）中「连播」「三天」「3 天」**出现 0 次**，命中即 `exit 1`；交付形式必须含「实操课」与「直播答疑」，对外文案必须出现「直播答疑」与「10+」。以后想改回连播口径，会被直接拦下。
        4. **为什么商品名不带「3天」**：现在连「3 天」这个交付节奏本身都不存在了，更谈不上写进商品名。**不许写「3天速成 / 3天见效 / 3天学会 / 立刻上手」**，承诺类表述由检查器 `PROMISE_V8` 词库硬拦截（包学会 / 包落地 / 包见效 / 速成 / 保证 / 必然见效…），命中即 `exit 1`。
        5. **为什么去英文「AI」**：商品名与海报里不再出现 AI 缩写，机审看到的是「{{product.name}}」+「{{vars.titleModifier}}」这两个纯技术信号。**中文「{{vars.titleModifier}}」保留**——它是类目方向词，也是机审识别「技术培训」类目的关键信号，删了等于自断类目归属。检查器新增 `/AI/` 断言（按词边界匹配，不会误伤 TRAINING / DETAIL 这类英文单词），命中即 `exit 1`。
        6. **类目信号不能丢**：商品名去掉「{{vars.titleModifier}}」后，海报主标题上方仍然保留这个类目标签，详情页也写着「{{vars.titleModifier}}方向的技术实操课程」——机器审核看的是「商品名 + 首图 + 详情页」三处，缺一处就少一个信号。检查器会断言：4 张封面上方槽位 = 修饰词，对外文案同时出现主标题与修饰词。
        7. **r3 的变更记录（仍然有效）**：标题主语从「{{brand.text}}AI原生组织实训营」换成「亿检智能体」——课程主体是**工具**，不是「组织变革」。上一版「AI 原生组织」读起来像一个自动运转的企业级方案，平台机审可能往「企业改造」那一侧归；换成「工具 + 小白 + 实操」之后，语义落在「工具操作 / 安装配置 / 提示词」这类官方允许的纯技术方向上。
        8. **删掉的「流程搭建示例」**：原 `CASE_STEPS`（检测报告交付流程 · 五步）、长图 detail-1 的 `CASE · 检测报告交付流程` 段、详情页的「流程搭建示例：检测报告交付流程」整节，全部移除。连带把 M4 从「业务流程搭建」改成「**工具串接与流程编排**」——示例删掉后原名里的「业务」二字没有落点了，改成工具口径后原有内容（节点配置 / 编排逻辑 / 验收标准）原样保留。
        9. **「流程」与「工作流」**：**「流程」「流程编排」可以出现，「工作流」必须 0 次**（「工作流程」含「工作流」子串，也会被检查器命中）。检查器已加断言防止改回来。
        10. **受众口径（延续 V8 上一版的整改，不回退）**：不写「创业者 / 实体老板 / 自媒体」，不写「一个人干一支团队的活」这类省钱增效暗示。本版新增的只有「零基础 / 没接触过也能跟上 / 从下载安装讲起」这种**技术学习口径**，安全。
        11. **品牌背景里的商业成绩数字**：继续不写（V7 的 300+ 家 / 72%↓ / 92% 全部删除）。「已落地多家实验室场景」是定性描述，保留。
        12. **平台合规口径**：教育培训类目禁止教授使用 AI 开展商业活动或营利的课程；允许纯技术类（工具操作、技术原理、提示词、代码开发、模型搭建）。但**允许清单不等于机审会放行**——机审是语义分类，凡是读起来像「企业自动生钱」的表达都会被归到营利课程。**具体条款编号与判定口径以两个平台后台最新规则为准，上架前需人工核对一次。**
        13. **类目建议**：优先选技术类目（人工智能 / 软件技术 / IT 技能 / IT 互联网技术培训），**不要**选副业、创业、营销、电商等盈利导向类目。商品属性填「虚拟商品 · 数字课程（智能体工具技术实战）」。
        14. **上架前必检**：官方禁用词库已内置在 `scripts/check-listing-compliance.ts`（含直接禁用词、间接话术、关联高危词、平台高危词、英文高危词五类，另加 V8 专属的平台绑定、经营口径、承诺类断言），一条命令跑完全量扫描，出现即删：
            `bun run scripts/check-listing-compliance.ts v8`
        15. **不要自行加价宣传**：图中与文案均不写死售价，价格在商品后台设置；也不要把「效果承诺」「回本」「多久见效」写进详情页。品牌背景里的商业成绩数字同样要删——**数字型商业成绩也会被读成效果承诺**。
        16. **域名**：官网地址已从图中移除，需要时再补。
        17. **图片**：封面大字报用 `main-0-title.png`，主图第 1 张用 `main-1-hero.png`；详情页建议按「主视觉 → 课程安排 → 适合谁 → 重要提醒 → 模块详解 → 作者与 FAQ」顺序铺排；需要单独介绍讲师时用 `detail-3-author.png`（讲师专页，与长图里的头像名片同源）。
        18. **纯色底图（重要）**：视频号小店在「送礼/推荐」等场景要用纯色底图，平台自带的 AI 编辑工具会把深底海报抠成“主体+白底”，白字直接消失、字变虚影，**不可用**。已改用本地重排的两张：
            - `main-5-plain-light.png`：浅底平涂（清新绿方案下为纯白底，文字全部深色系）
            - `main-6-plain-deep.png`：深底平涂（清新绿方案下为纯绿底，保留品牌色，主体对比更硬）
            两张都是 1080×1080、无渐变无纹理无暗角的平涂底，元素与 `main-0-title.png` 完全一致，可直接上传。
        19. **配色方案**：三套方案已参数化（暖色琥珀 / 经典商务蓝 / 清新绿），生成时用 `--theme` 选择，默认清新绿：
            `bun run scripts/gen-shop-listing.ts v8 --theme fresh`
            换方案时，`main-5-plain-light` / `main-6-plain-deep` 会自动换成对应方案的浅底 / 深底纯色图；加 `--out` 可换输出目录，避免覆盖当前交付：
            `bun run scripts/gen-shop-listing.ts v8 --theme blue --out ./outputs/shop-listing-v8-blue`
        20. **品牌位**：右上角统一「Logo + {{brand.text}}」（白色圆角 chip 承托），只有 `main-4-notice.png` 保留「利姆斯科技 · {{brand.text}}团队」全称。
        21. **作者**：署名已确认为「{{author.name}} · {{author.role}}」，头像使用 `assets/shop-listing/author-avatar.png`；换人需同步替换长图与详情文案。
        22. **录播与直播答疑的口径（合规文档 §三）**：详情页文案合规 ≠ 内容合规。实操课录播与直播答疑的口播必须统一为「工具实操教学、技术方法、流程编排」口径，不出现商业收益、平台运营、账号增长类表达；也不要说「几天就能见效」这类承诺。

