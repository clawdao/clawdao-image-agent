# V8 合规规则（当前交付版）
#
# V8 相对基线的三处收紧，全部来自 V7 被平台机审判为【AI盈利课程】的教训：
#
# ① 语义红线（机审是语义分类，不是关键词命中）
#    V7《AI数智化系统自我进化实战营》一个禁用词都没命中，却因为
#    「AI 数智化 + 系统 + 自我进化 + 实战营」读起来像一个「企业自动运转、
#    自己生钱的东西」而被归到营利课程。V8 把三个词根连根拔掉并硬断言 0 次。
#
# ② 英文缩写「AI」
#    r6 起商品名与海报不再出现 AI 缩写，机审看到的是「亿检智能体」+
#    「人工智能培训」两个纯技术信号。中文「人工智能培训」保留——它是类目方向词。
#
# ③ 旧交付节奏（事实性错误陈述）
#    本课程真实交付是 10+ 节实操课 + 作业模板 + 直播答疑 + 班级群交流，
#    从来没有 3 天连播。这类表述属虚假宣传风险，比用词违规更严重。

extends: "./configs/compliance/_base.yaml"
id: v8
label: V8 · 亿检智能体零基础实操训练营（当前交付版）

forbidden:
  # ── 平台绑定：案例直接绑定具体内容平台，易被判为「平台运营 / 变现教学」──
  platformBinding:
    - 公众号
    - 抖音
    - 小红书
    - 视频号
    - 快手
    - 哔哩哔哩
    - B站
    - 微博
    - 知乎
    - 头条号
    - 自媒体
    - 短视频平台
    - 直播带货
    - 店铺运营
    - 账号运营

  # ── 经营 / 接管口径：暗示学完可改造企业业务、接管业务环节、提升经营产出 ──
  businessHint:
    - 接管
    - 不劳而获
    - 业务结果
    - 经营成果
    - 经营产出
    - 改造业务
    - 改造企业
    - 商业收益
    - 商业回报
    - 变现路径
    - 赚钱思路
    - 吸粉
    - 引粉
    - 养号

  # ── 承诺类表达：把交付节奏写成效果承诺 ─────────────────────
  promise:
    - 速成
    - 包学会
    - 包落地
    - 包见效
    - 保证学会
    - 保证能
    - 保证效果
    - 一定能
    - 必然见效
    - 立刻见效
    - 马上见效
    - 几天见效
    - 立刻上手
    - 马上上手
    - 轻松掌握
    - 轻松学会
    - 快速上手
    - 快速掌握
    - 短时间见效

# ── 主题词：平台反馈「工作流」已过时，不能作为课程核心主题 ──
themeForbidden:
  - 工作流

# ── 语义红线：对外文案与海报中 0 次 ───────────────────────
semanticForbidden:
  - 系统
  - 自我进化
  - 数智化

# ── 英文缩写断言（按词边界匹配，不误伤 TRAINING / DETAIL）──
acronymForbidden:
  - pattern: "\bAI\b"
    label: 英文缩写「AI」

# ── 旧交付节奏断言 ────────────────────────────────────────
staleDelivery:
  words:
    - 连播
    - 三天
  patterns:
    - "3\\s*天"

# ── 正向词（覆盖提示，不阻断）──────────────────────────────
positiveHints:
  - 工具
  - 自动化
  - 流程编排
  - 工具串接
  - 流程
  - 内容生产
  - 信息整理
  - 技能沉淀
  - 创作辅助
  - 提示词
  - 安装配置
  - 智能体
  - 可复用
  - 持续优化
  - 验收标准
  - 反馈—调整—再验证
  - 零基础
  - 实操

# ── 断言 ───────────────────────────────────────────────────
assertions:
  brandSlot:
    enabled: true
    fullBrandOnlyOn:
      - main-4-notice
  title:
    enabled: true
    modifierVar: titleModifier
    mainVar: titleMain
    coverFiles:
      - main-0-title
      - main-1-hero
      - main-5-plain-light
      - main-6-plain-deep
    forbidShortCycleInName: true
    deliveryMustInclude:
      - 实操课
      - 直播答疑
    copyMustInclude:
      - text: 直播答疑
      - pattern: "10\\s*\\+"
    copyMustNotInclude:
      - 流程搭建示例
      - 检测报告交付
    footerAllowlist:
      - 五个模块，从装工具到跑通第一个智能体
    staleTitles:
      - 亿检链AI原生组织实训营
      - 亿检智能体小白实操3天训练营
      - 亿检智能体小白实操训练营
      - 人工智能培训 | AI智能体小白实操训练营
      - AI智能体小白实操训练营
      - 组织实训营
      - AI原生组织
