# V7 合规规则（历史版 —— 已被平台判【AI盈利课程】，勿再上架，仅供对照）
#
# V7 = 《AI数智化系统自我进化实战营》。平台机审判定理由：
#   「涉及【AI盈利课程】，平台暂未开放售卖……请仔细检查课程是否涉及
#    教授使用AI开展商业活动或营利等内容」
#
# 关键教训：**它一个禁用词都没命中**，机审是按语义归类的。
# V8 的收紧（语义红线 / 去英文缩写 / 旧交付节奏）见 configs/compliance/v8.yaml。

extends: "./configs/compliance/_base.yaml"
id: v7
label: V7 · AI数智化系统自我进化实战营（已被驳回，仅供对照）

# 主题词：平台反馈「工作流」已过时
themeForbidden:
  - 工作流

# 正向词（覆盖提示，不阻断）
positiveHints:
  - 工具
  - 数智化
  - 自动化
  - 提效
  - 流程复用
  - 内容生产
  - 信息整理
  - 项目搭建
  - 能力沉淀
  - 创作辅助
  - 素材加工
  - 技能积累
  - 提示词
  - 安装配置
  - 智能体
  - 系统搭建
  - 可复用

assertions:
  brandSlot:
    enabled: true
    fullBrandOnlyOn:
      - main-4-notice
