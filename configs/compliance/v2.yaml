# V2 合规规则（历史版 · 暖色琥珀 · **预期不合规**）
#
# V2《AI赚钱系统自我进化训练营》含「赚钱 / 变现 / 副业」等盈利导向表述，
# 微信小店已按「AI 盈利课程」口径不予放行。
#
# 这份配置保留下来有两个用途：
#   1. 让 V2 仍可复现（历史交付物对照）
#   2. 当作反面样本：跑 `bun run scripts/check-listing-compliance.ts v2` 会直接命中
#      禁用词并 exit 1 —— 这正是它被平台驳回的原因。
#
# 规则沿用基线（configs/compliance/_base.yaml），不做任何放宽。

extends: "./configs/compliance/_base.yaml"
id: v2
label: V2 · AI赚钱系统自我进化训练营（含盈利导向表述，预期不合规）

# 正向词（覆盖提示，不阻断）
positiveHints:
