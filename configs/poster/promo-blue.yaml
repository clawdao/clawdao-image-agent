# promo-blue.yaml —— 宣传海报（竖版长图 · 纯色亮蓝 · 白色信息卡）
#
# 版式骨架（1:1 对齐参考模板的像素坐标，成品 800×2000）：
#   通栏纯蓝底 #007AFF
#   → 顶部居中：品牌小标 / 超大主标题 / 副标题
#   → 白色大圆角主卡（约占画布宽 79%，上沿在 31.6% 处）
#       · 卡内标题 + 交付口径说明
#       · 2×2 卖点矩阵
#       · 加入引导（CTA）
#   → 独立白底二维码方框压在主卡下沿（叠压 131px）
#   → 二维码说明（深色小字）
#   → 紧凑双行页脚
#
# ⚠️ 二维码是占位码：内容编码 https://REPLACE-ME/agent-course，
#    上架前把 configs/poster/promo-blue.yaml 里 qr.content 换成真实落地页地址，
#    再跑一次 `bun run scripts/gen-poster.ts promo-blue` 即可（其余版式不用动）。

id: promo-blue
label: 宣传海报（纯色亮蓝 · 白卡信息型）
kind: poster

tone: solid_blue
background: solid
anchor: top

size:
  width: 800
  height: 2000

padding:
  top: 128
  bottom: 26

compliance: v8

blocks:
  # —— 顶部标题区（眉标 / 主标题 / 副标题）——
  - kind: centerTitle
    kicker: 亿检链 · 智能体工具课
    title: 亿检智能体
    subtitle: 零基础实操训练营 · 从下载安装到跑通第一个智能体
    kickerScale: 0.05
    kickerGap: 74
    titleScale: 0.135
    subtitleScale: 0.0325
    subtitleGap: 97

  # —— 白色信息卡 ——
  - kind: panel
    gapBefore: 159
    widthRatio: 0.922
    padding: 40
    radius: 34
    shadow: 22
    minHeight: 804
    blocks:
      # 卡内顶部留白（把卡标题压到模板的 709px）
      - kind: spacer
        heightPx: 29

      # 卡内标题
      - kind: centerTitle
        title: 五个模块，轻松上手
        titleScale: 0.0575

      # 交付口径（灰字小行）
      - kind: centerTitle
        note: 10+ 节实操课 · 作业模板 · 直播答疑 · 班级群交流
        noteScale: 0.026
        noteGap: 39
        gapBefore: 39

      # 2×2 卖点矩阵
      - kind: grid
        columns: 2
        titleScale: 0.0425
        descScale: 0.0325
        descLineHeight: 1.3
        descMaxLines: 2
        titleGap: 40
        rowGap: 49
        gapBefore: 65
        items:
          - title: 环境安装
            desc: 下载安装、账号权限、基础配置
          - title: 提示词结构
            desc: 需求拆解、模板写法、参数调试
          - title: 工具串接
            desc: 多工具协作、参数调整、异常处理
          - title: 验收复盘
            desc: 过程记录、验收清单、迭代方法

      # 加入引导
      - kind: centerTitle
        title: 亿检链邀请你加入
        titleScale: 0.0475
        gapBefore: 30

      # 卡内底部留白（弹性占位，主卡底边落在 1436px）
      - kind: spacer
        fill: true

  # —— 二维码（白框压在主卡下沿）——
  - kind: qr
    content: https://REPLACE-ME/agent-course
    frame: square
    frameWidth: 469
    frameRadius: 14
    frameFill: '#FFFFFF'
    frameStroke: '#FFFFFF'
    framePad: 0
    overlap: 131
    caption: 扫码查看课程详情
    captionScale: 0.0375
    captionGap: 7
    captionColor: '#00234A'
    gapBefore: 0

  # —— 紧凑双行页脚 ——
  - kind: footer
    text: 工具怎么装 · 步骤怎么做 · 结果怎么验
    sub: 利姆斯科技 · 亿检链团队
    divider: false
    size: 0.0325
    subSize: 0.03
    subGap: 30
    trailing: 0
    color: '#D6E7FF'
    gapBefore: 57
